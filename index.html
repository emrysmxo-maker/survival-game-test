<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Survival: Тест-Полигон</title>

  <!-- Отдельный PWA Manifest и значок для создания второго независимого АПК на телефоне -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#18301c">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="assets/icons/icon.svg">

  <!-- Базовый URL указывает на основной репозиторий, откуда загружаются настоящие 2K текстуры, 3D Soldier.glb, деревья и звуки -->
  <base href="https://emrysmxo-maker.github.io/survival-game/">

  <script>document.write('<link rel="stylesheet" href="style.css?v=' + Date.now() + '">');</script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('https://emrysmxo-maker.github.io/survival-game-test/sw.js').catch(function () {});
    }
  </script>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div id="ui-overlay">
    <div id="debug-panel">
      <div>🌍 Экосистема: <span id="info-biome" class="biome-tag">Тестовый полигон</span></div>
      <div>📍 Координаты: <span id="info-coords" class="badge">X: 0, Y: 0</span></div>
      <div>🌲 Деревьев в кадре: <span id="info-trees" class="badge">0</span></div>
    </div>

    <div id="minimap"><canvas id="minimap-canvas" width="180" height="180"></canvas></div>
    <div id="bigmap"><canvas id="bigmap-canvas"></canvas><div id="bigmap-legend">
      <span style="color:#4a7a8c">■</span> ручей · <span style="color:#4b5a34">■</span> болото ·
      <span style="color:#a7b56a">■</span> поляна · <span style="color:#8a8a80">■</span> камни ·
      <span style="color:#c9a86a">■</span> тропа · <span style="color:#e04030">●</span> зомби<br>
      Нажмите, чтобы закрыть</div></div>

    <div id="zombie-btn">ЗОМБИ +</div>
    <div id="auto-btn">АВТО<br>ОГОНЬ</div>

    <div id="fire-btn"><div id="fire-knob"></div><span>ОГОНЬ</span></div>

    <div id="rot-btn">↻ две руки: горизонтально</div>
    <div id="version-tag">TEST POLIGON v2.0</div>
  </div>

  <!-- Three.js и загрузчик 3D-моделей GLTF для персонажа -->
  <script src="assets/vendor/three.min.js"></script>
  <script src="assets/vendor/GLTFLoader.js"></script>

  <script>
    window.BUILD_VERSION = Date.now();
    ['version', 'dbg', 'ground', 'config', 'sprites-data', 'assets', 'character', 'cover', 'effects', 'daynight', 'world', 'player', 'weapon', 'zombie', 'minimap', 'input', 'render', 'update', 'main', 'perf', 'viewfix'].forEach((name) => {
      document.write(`<script src="src/${name}.js?v=${window.BUILD_VERSION}"><\/script>`);
    });
  </script>

  <!-- Скрипты тестовых 3D-построек с чистыми тенями солнца -->
  <script src="https://emrysmxo-maker.github.io/survival-game-test/src/textures.js?v=2"></script>
  <script src="https://emrysmxo-maker.github.io/survival-game-test/src/buildings.js?v=2"></script>
  <script src="https://emrysmxo-maker.github.io/survival-game-test/src/test_override.js?v=2"></script>

</body>
</html>
