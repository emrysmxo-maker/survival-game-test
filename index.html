<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Survival Game: Тест-полигон</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#166534">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="https://emrysmxo-maker.github.io/survival-game/assets/icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  </script>
</head>
<body>

  <canvas id="canvas3d"></canvas>

  <div id="ui-overlay">
    <!-- Верхняя панель: статус, FPS, качество и солнце -->
    <div id="top-bar">
      <div class="panel-block">
        <div>🚀 <span id="info-fps" class="badge">60 FPS</span></div>
        <div>📍 <span id="info-coords" class="badge">X: 0.0, Z: 0.0</span></div>
        <div>⏱️ <span id="time-tag" class="badge">12:00</span></div>
      </div>

      <!-- Переключатель времени суток (проверка динамических теней солнца) -->
      <div id="time-controls" class="panel-block">
        <button class="time-btn active" data-time="12">☀️ День</button>
        <button class="time-btn" data-time="18.2">🌅 Закат</button>
        <button class="time-btn" data-time="0">🌙 Ночь</button>
        <button class="time-btn" data-time="auto">⏰ Авто</button>
      </div>

      <!-- Кнопка смены профиля качества (Ультра / Высокое / Среднее / Эконом) -->
      <button id="quality-btn">⚡ УЛЬТРА (3.3x)</button>
    </div>

    <!-- Кнопки быстрого перемещения к постройкам -->
    <div id="teleport-bar">
      <button id="tp-cabin" class="tp-btn">🏕️ Сруб</button>
      <button id="tp-post" class="tp-btn">🎖️ Блокпост</button>
      <button id="tp-ruin" class="tp-btn">🏚️ Руины</button>
      <button id="tp-bunker" class="tp-btn">🚪 Бункер</button>
    </div>

    <!-- Кнопка вызова зомби (правильный масштаб!) -->
    <div id="zombie-btn">ЗОМБИ +</div>

    <!-- Кнопка авто-огня -->
    <div id="auto-btn">АВТО<br>ОГОНЬ</div>

    <!-- Плавающий стик ходьбы (левая половина) -->
    <div id="walk-stick"><div id="walk-knob"></div></div>

    <!-- Плавающий стик огня и прицела (правая половина) -->
    <div id="fire-btn"><div id="fire-knob"></div></div>

    <!-- Кнопка поворота экрана -->
    <div id="rot-btn">↻ две руки: горизонтально</div>

    <div id="version-tag">TEST POLIGON v1.0 · <span id="quality-tag">Ультра (3.3x)</span></div>
  </div>

  <!-- Three.js движок из основного репозитория -->
  <script src="https://emrysmxo-maker.github.io/survival-game/assets/vendor/three.min.js"></script>

  <!-- Скрипты тестового полигона -->
  <script src="src/textures.js"></script>
  <script src="src/buildings.js"></script>
  <script src="src/game.js"></script>

</body>
</html>
